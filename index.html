<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Presentation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }

    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.5px;
    }

    p {
      color: #888;
      margin-bottom: 3rem;
      font-size: 1rem;
    }

    .cards {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    a.card {
      display: block;
      width: 260px;
      padding: 2rem 1.5rem;
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    }

    a.card:hover {
      transform: translateY(-4px);
      border-color: #6c63ff;
      box-shadow: 0 8px 32px rgba(108, 99, 255, 0.2);
    }

    .card .icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .card .title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }

    .card .desc {
      font-size: 0.85rem;
      color: #888;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>AI Presentation</h1>
    <p>Select a presentation to begin</p>
    <div class="cards">
      <a class="card" href="ai_capital_flow_v2.html">
        <div class="icon">💹</div>
        <div class="title">AI & Capital Flow</div>
        <div class="desc">How artificial intelligence is reshaping capital markets and investment flows.</div>
      </a>
      <a class="card" href="ai_shock_simulation.html">
        <div class="icon">⚡</div>
        <div class="title">AI Shock Simulation</div>
        <div class="desc">Simulating economic shocks driven by rapid AI adoption and disruption.</div>
      </a>
    </div>
  </div>
</body>
</html>
